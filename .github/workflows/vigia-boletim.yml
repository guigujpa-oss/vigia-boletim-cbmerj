name: Vigia Boletim CBMERJ 24/7

on:
  schedule:
    # Executa a cada 15 minutos (cron do GitHub Actions)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite disparo manual com 1 clique no painel do GitHub Actions

permissions:
  contents: write # Permite salvar data/last_bulletin.json de volta no repositório

jobs:
  vigiar-boletim:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install --omit=dev --no-audit --no-fund

      - name: Executar Checagem de Boletim CBMERJ
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INTRANET_COOKIE: ${{ secrets.INTRANET_COOKIE }}
          GITHUB_ACTIONS: 'true'
        run: node server/boletimWatcher.js --once

      - name: Persistir estado do último boletim processado
        run: |
          git config --global user.name "Boletim Bot CBMERJ"
          git config --global user.email "bot-boletim@cbmerj.local"
          # Descartar alterações geradas pelo npm install (ex: package-lock.json)
          git checkout -- package-lock.json 2>/dev/null || true
          
          # Verificar se data/last_bulletin.json teve alterações
          if [ -n "$(git status --porcelain data/last_bulletin.json)" ]; then
            git add data/last_bulletin.json
            git commit -m "chore: atualizar status do ultimo boletim [skip ci]"
            git push
            echo "Estado do último boletim atualizado no repositório!"
          else
            echo "Nenhuma alteração no estado do boletim. Repositório já está em dia."
          fi
