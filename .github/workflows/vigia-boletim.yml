name: Vigia Boletim CBMERJ 24/7

on:
  schedule:
    # Executa a cada 25 minutos (emendando ciclos contínuos)
    - cron: '*/25 * * * *'
  workflow_dispatch: # Permite disparo manual

concurrency:
  group: vigia-boletim
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  vigiar-boletim:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install --omit=dev --no-audit --no-fund

      - name: Executar Vigia Instantâneo (Checagem a cada 30s por 24 min)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INTRANET_COOKIE: ${{ secrets.INTRANET_COOKIE }}
        run: node server/boletimWatcher.js --duration=24 --interval=30

      - name: Persistir estado do último boletim processado
        if: always()
        run: |
          git config --global user.name "Boletim Bot CBMERJ"
          git config --global user.email "bot-boletim@cbmerj.local"
          git checkout -- package-lock.json 2>/dev/null || true
          
          if [ -n "$(git status --porcelain data/last_bulletin.json)" ]; then
            git add data/last_bulletin.json
            git commit -m "chore: atualizar status do ultimo boletim [skip ci]"
            git push
            echo "Estado do último boletim atualizado com sucesso no repositório!"
          else
            echo "Nenhuma alteração no estado do boletim. Repositório em dia."
          fi
