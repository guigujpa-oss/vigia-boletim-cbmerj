services:
  - type: web
    name: vigia-boletim-cbmerj
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: node server/cloudWorker.js
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        value: "1088891648"
      - key: INTRANET_COOKIE
        sync: false
      - key: CHECK_INTERVAL_SEC
        value: "30"
